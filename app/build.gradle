plugins { id 'com.android.application' }
android {
    namespace 'com.leafreader.app'
    compileSdk 35
    defaultConfig { applicationId 'com.leafreader.app'; minSdk 26; targetSdk 35; versionCode 14; versionName '0.1.13' }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}

dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4' }
